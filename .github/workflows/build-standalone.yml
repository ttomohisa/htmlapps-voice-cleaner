name: Validate standalone HTML

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/deploy-pages.yml"
      - "scripts/**"
      - "app.config.json"
      - "dependencies.json"
      - "dependencies.lock.json"
      - "schemas/dependencies*.json"
      - ".github/workflows/dependency-updates.yml"
      - "build-standalone.ps1"
      - "build-standalone.bat"
      - "scripts/build-self-extract.ps1"
      - "scripts/verify-self-extract.ps1"
      - ".github/workflows/build-standalone.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate PowerShell syntax and encoding
        shell: powershell
        run: .\scripts\check-powershell-syntax.ps1

      - name: Build and verify standalone HTML
        shell: pwsh
        run: ./scripts/check-repository.ps1

      - name: Audio workflow regression tests
        shell: pwsh
        run: |
          node --test tests/mobile-help-footer.test.cjs tests/audio-state-regression.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Audio workflow regressions failed.' }

      - name: Browser audio-processing smoke test
        shell: pwsh
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --prefix .browser-smoke playwright-core@1.55.0
          node ./scripts/smoke-browser.cjs

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v7
        with:
          name: standalone-html-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            *.html
            dist/index.html
            dist/index.self-extract.html
            dist/dependency-manifest.json
            dist/self-extract-manifest.json
            dist/.nojekyll
          if-no-files-found: error
          retention-days: 14

  verify-release-bundle:
    name: Verify release bundle before merge
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout release files
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download exactly the validated standalone artifact
        uses: actions/download-artifact@v8
        with:
          name: standalone-html-${{ github.event.pull_request.head.sha || github.sha }}
          path: package

      - name: Test release packaging and checksums
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r '.version' app.config.json)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          prefix="htmlapps-voice-cleaner-v${version}"
          test -s package/dist/index.html
          test -s package/dist/index.self-extract.html
          test -s LICENSE
          test -s THIRD_PARTY_NOTICES.md
          test -s README.md
          test -s README.ja.md
          mkdir -p release zip-content
          cp package/dist/index.html "release/${prefix}.html"
          cp package/dist/index.self-extract.html "release/${prefix}.self-extract.html"
          cp "release/${prefix}.html" "zip-content/"
          cp "release/${prefix}.self-extract.html" "zip-content/"
          cp LICENSE THIRD_PARTY_NOTICES.md README.md README.ja.md zip-content/
          (cd zip-content && zip -q -9 -r "../release/${prefix}.zip" .)
          (cd release && sha256sum "${prefix}.html" "${prefix}.self-extract.html" "${prefix}.zip" > SHA256SUMS.txt)
          (cd release && sha256sum -c SHA256SUMS.txt)
          unzip -t "release/${prefix}.zip"
          unzip -l "release/${prefix}.zip"
          echo "Release files and checksums verified without publishing a tag or release."
