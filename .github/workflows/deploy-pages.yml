name: Deploy standalone app to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      pages-ready: ${{ steps.pages-status.outputs.ready }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate PowerShell syntax and encoding
        shell: powershell
        run: .\scripts\check-powershell-syntax.ps1

      - name: Build and verify standalone HTML
        shell: pwsh
        run: ./scripts/check-repository.ps1

      - name: Audio workflow regression tests
        shell: pwsh
        run: |
          node --test tests/mobile-help-footer.test.cjs tests/audio-state-regression.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Audio workflow regressions failed.' }

      - name: Browser audio-processing smoke test
        shell: pwsh
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --prefix .browser-smoke playwright-core@1.55.0
          if ($LASTEXITCODE -ne 0) { throw 'Browser test setup failed.' }
          node ./scripts/smoke-browser.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Browser audio processing smoke test failed.' }

      - name: Check whether GitHub Pages is enabled
        id: pages-status
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$env:GITHUB_REPOSITORY/pages" --silent 2>$null

          if ($LASTEXITCODE -eq 0) {
            "ready=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "GitHub Pages is enabled. The deployment will continue."
            exit 0
          }

          "ready=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          @"
          ## GitHub Pages is not enabled yet

          The standalone HTML was built successfully, but deployment was skipped.

          1. Open **Settings → Pages** in this repository.
          2. Under **Build and deployment**, set **Source** to **GitHub Actions**.
          3. Open **Actions**, select this workflow, and choose **Re-run all jobs**.

          This one-time repository setting cannot be enabled with the default `GITHUB_TOKEN`.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          Write-Warning "GitHub Pages is not enabled. Deployment is skipped; see the workflow summary for setup steps."
          exit 0

      - name: Configure GitHub Pages
        if: steps.pages-status.outputs.ready == 'true'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: steps.pages-status.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Upload standalone build artifact
        uses: actions/upload-artifact@v7
        with:
          name: standalone-html-${{ github.sha }}
          path: |
            *.html
            dist/index.html
            dist/index.self-extract.html
            dist/dependency-manifest.json
            dist/self-extract-manifest.json
            dist/.nojekyll
          if-no-files-found: error
          retention-days: 14

  deploy:
    if: needs.build.outputs.pages-ready == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # A merged PR pushes its tested version to main. A version publishes only once.
  release:
    name: Tag and publish GitHub Release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: voice-cleaner-version-release
      cancel-in-progress: false
    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check version and existing release
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(jq -r '.version' app.config.json)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::app.config.json must contain a Semantic Versioning release version."
            exit 1
          fi
          tag="v${version}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Release $tag already exists; no duplicate will be created."
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag exists without a GitHub Release. Inspect it before retrying."
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Download validated standalone HTML
        if: steps.version.outputs.skip == 'false'
        uses: actions/download-artifact@v8
        with:
          name: standalone-html-${{ github.sha }}
          path: package

      - name: Prepare versioned release files and checksums
        if: steps.version.outputs.skip == 'false'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          prefix="htmlapps-voice-cleaner-${RELEASE_TAG}"
          test -s package/dist/index.html
          test -s package/dist/index.self-extract.html
          mkdir -p release zip-content
          cp package/dist/index.html "release/${prefix}.html"
          cp package/dist/index.self-extract.html "release/${prefix}.self-extract.html"
          cp "release/${prefix}.html" "zip-content/"
          cp "release/${prefix}.self-extract.html" "zip-content/"
          cp LICENSE THIRD_PARTY_NOTICES.md README.md README.ja.md zip-content/
          (cd zip-content && zip -q -9 -r "../release/${prefix}.zip" .)
          (cd release && sha256sum "${prefix}.html" "${prefix}.self-extract.html" "${prefix}.zip" > SHA256SUMS.txt)
          ls -lh release/

      - name: Create tag and GitHub Release
        if: steps.version.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # GitHub CLI creates the missing tag at this exact merged commit.
          gh release create "$RELEASE_TAG" \
            release/* \
            --target "$GITHUB_SHA" \
            --title "Voice Cleaner $RELEASE_TAG" \
            --generate-notes \
            --latest
